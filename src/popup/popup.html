<!doctype html>
<html lang="no" data-theme="olmonopolet-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ølmonopolet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/popup.css" />
  </head>

  <body>
    <div class="card">
      <div class="header">
        <h1 class="title">Ølmonopolet</h1>
      </div>

      <div class="auth">
        <span id="auth-status" class="auth-status">Ikke tilkoblet</span>
        <a
          id="auth-login"
          href="https://olmonopolet.app/login"
          target="_blank"
          rel="noopener noreferrer"
          class="btn btn-primary btn-sm"
        >
          Logg inn
        </a>
        <button
          id="auth-logout"
          type="button"
          class="btn btn-outline btn-sm"
          hidden
        >
          Logg ut
        </button>
      </div>

      <div class="section-label">Innstillinger</div>

      <label class="setting setting--stack">
        <span>Untappd-etikett</span>
        <select id="select-label">
          <option value="off">Av</option>
          <option value="fill-if-missing">Kun hvis bilde mangler</option>
          <option value="override">Alltid</option>
        </select>
      </label>

      <label class="setting">
        <span>Demp smakte produkter</span>
        <span class="switch">
          <input type="checkbox" id="toggle-tasted-dim" />
          <span class="slider"></span>
        </span>
      </label>

      <div class="links">
        <a
          href="https://olmonopolet.app/"
          target="_blank"
          rel="noopener noreferrer"
          class="btn btn-primary"
        >
          Besøk olmonopolet.app
        </a>
        <a
          href="https://patreon.com/olmonopolet"
          target="_blank"
          rel="noopener noreferrer"
          class="btn btn-outline"
        >
          Støtt på Patreon
        </a>
        <a
          href="https://www.facebook.com/BeermonopolyNO/"
          target="_blank"
          rel="noopener noreferrer"
          class="btn btn-outline"
        >
          Følg på Facebook
        </a>
      </div>

      <p class="footer">© 2026 Ølmonopolet. Ikke tilknyttet Vinmonopolet.</p>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
