<main id="page" data-react-component="[[slug]]/p/[id]">
  <div class="product-top">
    <div class="sMnNlv3t no-print">
      <button
        class="btn-icon"
        title="Gi produkt opp til 5 stjerner."
        aria-label="Gi produkt opp til 5 stjerner."
      >
        <div class="icon"></div>
      </button>
      <button class="btn-icon" title="Min liste" aria-label="Min liste">
        <div class="icon"></div>
      </button>
    </div>
    <div class="image-wrap">
      <img
        alt="Bilde av produktet Disko Agent India Pale Ale"
        srcset="15616302-1.jpg 150w"
        sizes="300px"
      />
    </div>
    <div class="info-wrap">
      <div class="name-block">
        <p class="category" data-track-link-click="product-categories">
          <a href="/search?q=:øl">Øl</a> - <a href="/search?q=:øl:ipa">India pale ale</a>
        </p>
        <h1 class="name">Disko Agent India Pale Ale</h1>
        <p class="region" data-track-link-click="product-region">
          <a href="#">Norge</a>, <a href="#">Buskerud</a>, <a href="#">Lier</a>
        </p>
      </div>
      <div class="price-block">
        <div class="price-row">
          <span class="price" aria-label="80 kroner">Kr&nbsp;80,00</span>
          <span class="volume-cost">
            <span aria-label="44 centiliter">44 cl</span>
            <span aria-label="177 kroner og 27 øre per liter">177,27 kr/l</span>
          </span>
        </div>
        <hr />
        <p>Fruktig, med balansert bitterhet.</p>
        <p class="alcohol">
          <span aria-label="7 prosent"><strong>Alkohol</strong> 7%</span>
        </p>
      </div>
    </div>
  </div>
  <ul class="details-list">
    <li data-track-link-click="product-varetype">
      <span>Varetype</span>
      <span><a href="/search?q=:øl">Øl</a> - <a href="/search?q=:øl:ipa">India pale ale</a></span>
    </li>
    <li><span>Varenummer</span><span>15616302</span></li>
  </ul>
</main>
